<!DOCTYPE html><html lang="zh-CN"><head>
<meta name="robots" content="noindex,nofollow,noarchive"><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>邵汉青 · 微信加粉助手</title>
<style>
:root{--navy:#102C5C;--navy2:#1c3f7a;--accent:#E8A33D;--green:#1f9d57;--bg:#eef1f6;--line:#e3e8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#1f2733}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:12px 14px;position:sticky;top:0;z-index:10}
header .t{font-size:15px;font-weight:700}
header .prog{font-size:12px;opacity:.92;margin-top:3px;line-height:1.5}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.filters{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:78px;z-index:9}
.filters button{flex:none;border:1px solid var(--line);background:#fff;color:var(--navy2);font-size:13px;padding:6px 13px;border-radius:20px}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.filters button.pen{background:#f0a830;color:#fff;border-color:#f0a830}
.filters button.old{background:#7f8c9b;color:#fff;border-color:#7f8c9b}
.filters button.exp{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.flab{flex:none;align-self:center;font-size:12px;color:#9aa3b0;margin:0 8px 0 4px;white-space:nowrap;font-weight:700}
.flab:first-child{margin-left:0}
.search{padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none}
.search select{flex:none;max-width:42%;padding:9px 6px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;background:#fff;color:var(--navy2)}
.nm-input{width:100%;box-sizing:border-box;font-size:20px;font-weight:800;color:#1c3f7a;border:1px solid #dfe6f0;border-radius:10px;padding:8px 10px;margin:2px 0 4px;outline:none;background:#fbfdff}
.field{margin:2px 0 8px;}
.flbl{font-size:12px;color:#8a97ab;margin:0 0 3px 2px;}
.wrap{padding:12px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(16,44,92,.06)}
.card .lv{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;color:#fff;background:var(--navy2);margin-bottom:8px}
.card .nm{font-size:19px;font-weight:800;color:var(--navy)}
.card .meta{font-size:13px;color:#7c879a;margin-top:3px}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;padding:11px 12px;background:#f7faff;border:1px solid var(--line);border-radius:10px}
.row .k{font-size:12px;color:var(--navy2);font-weight:700;flex:none;width:64px}
.row .v{font-size:14px;flex:1;word-break:break-all}
.row a.tel{color:var(--navy);text-decoration:none;font-weight:700}
.script{margin-top:12px;background:#fffaf0;border:1px solid #f3e2c2;border-radius:10px;padding:12px;font-size:14px;line-height:1.65;color:#5a4a2e;white-space:pre-wrap}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns button{flex:1;min-width:0;padding:13px 6px;border:none;border-radius:11px;font-size:14px;font-weight:700;color:#fff}
.b-copy{background:var(--navy)}.b-sent{background:#f0a830}.b-pass{background:var(--green)}.b-old{background:#7f8c9b}
.b-prev,.b-next{background:#fff;color:var(--navy2);border:1px solid var(--line)}.b-prev{flex:.6}.b-next{flex:.6}
.status{margin-top:12px;font-size:13px;color:var(--muted);text-align:center}.status b{color:var(--green)}
.nav{display:flex;gap:8px;margin-top:12px}
.hint{font-size:12px;color:#7c879a;margin-top:10px;line-height:1.6;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:10px}
@media(min-width:600px){.wrap{padding:20px}}
</style></head><body>
<header>
  <div class="t">邵汉青 · 微信加粉助手</div>
  <div class="prog" id="prog"></div>
  <div class="bar"><i id="bar"></i></div>
</header>
<div class="filters" id="filters">
  <span class="flab">状态</span>
  <button data-dim="st" data-v="all" class="on">全部</button>
  <button data-dim="st" data-v="待加">待加</button>
  <button data-dim="st" data-v="待通过" class="pen">待通过</button>
  <button data-dim="st" data-v="已通过">已通过</button>
  <button data-dim="st" data-v="已加过" class="old">已加过</button>
  <span class="flab">等级</span>
  <button data-dim="lv" data-v="S">S</button><button data-dim="lv" data-v="A">A</button>
  <button data-dim="lv" data-v="B">B</button><button data-dim="lv" data-v="C">C</button><button data-dim="lv" data-v="D">D</button>
  <button class="exp" onclick="exportProgress()">📤 导出进度</button>
  <button class="exp" onclick="document.getElementById('imp').click()">📥 导入进度</button>
  <input id="imp" type="file" accept=".csv,text/csv" style="display:none" onchange="importProgress(this)">
</div>
<div class="search"><input id="q" placeholder="搜客户名 / 城市"/><select id="city"><option value="">全部城市</option></select></div>
<style>
#gate{position:fixed;inset:0;background:linear-gradient(160deg,#0f2c5c,#1c3f7a);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow:auto;padding:16px 0;}
#gate .box{background:#fff;border-radius:16px;padding:30px 22px;width:86%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.35);text-align:center;margin:auto;}
#gate h2{margin:0 0 6px;color:#1c3f7a;font-size:19px;}
#gate p{margin:0 0 16px;color:#666;font-size:13px;line-height:1.6;}
#gate input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1.5px solid #1c3f7a;border-radius:10px;margin-bottom:14px;text-align:center;}
#gate button{width:100%;padding:12px;font-size:16px;background:#1c3f7a;color:#fff;border:none;border-radius:10px;font-weight:700;-webkit-appearance:none;}
#gate button:disabled{opacity:.65;}
#gate .err{color:#c0392b;font-size:12px;min-height:16px;margin-top:8px;}
</style>
<div id="gate">
  <div class="box">
    <h2>🔒 微信加粉助手</h2>
    <p>请输入访问密码<br>（首次使用请向邵汉青获取）</p>
    <input id="pw" type="password" placeholder="访问密码" autocomplete="off">
    <button onclick="if(typeof unlock==='function'){unlock()}else{document.getElementById('gerr').textContent='页面未加载完整，请下拉刷新'}">解锁进入</button>
    <div class="err" id="gerr"></div>
  </div>
</div>

function gunzip(u8){
  if(typeof DecompressionStream==='undefined'){
    if(typeof fflate!=='undefined' && fflate.gunzipSync){
      try{ return Promise.resolve(fflate.gunzipSync(u8).buffer); }catch(e){ return Promise.reject(e); }
    }
    return Promise.reject(new Error('OLD_BROWSER'));
  }
  return new Promise((resolve,reject)=>{
    try{
      const ds=new DecompressionStream('gzip');
      const writer=ds.writable.getWriter();
      writer.write(u8); writer.close();
      const reader=ds.readable.getReader();
      const chunks=[]; let total=0;
      (function pump(){
        reader.read().then(({done,value})=>{
          if(done){
            const out=new Uint8Array(total); let off=0;
            for(const c of chunks){ out.set(c,off); off+=c.length; }
            resolve(out.buffer); return;
          }
          chunks.push(value); total+=value.length; pump();
        }).catch(reject);
      })();
    }catch(e){ reject(e); }
  });
}
function decrypt(encB64, password){
  const bin=atob(encB64); const buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
  const salt=buf.slice(0,16), iv=buf.slice(16,28), ct=buf.slice(28);
  return crypto.subtle.importKey('raw',new TextEncoder().encode(password),{name:'PBKDF2'},false,['deriveKey'])
    .then(base=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']))
    .then(key=>crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct))
    .then(raw=>gunzip(new Uint8Array(raw)))
    .then(ab=>JSON.parse(new TextDecoder().decode(ab)));
}
function initApp(){
  OLD_SEED.forEach(n=>{ if(!SEED.includes(n) && prog[n] && prog[n].s==='已加过') delete prog[n]; });
  SEED.forEach(n=>{
    if(prog[n] && (prog[n].s==='已发送'||prog[n].s==='已通过')) return;
    prog[n]={s:'已加过'};
  });
  save();
  document.getElementById('filters').addEventListener('click',e=>{
    if(e.target.tagName!=='BUTTON')return;
    if(e.target.classList.contains('exp'))return;
    const dim=e.target.dataset.dim, v=e.target.dataset.v;
    if(dim==='st'){ if(v==='all') fSt.clear(); else { if(fSt.has(v)) fSt.delete(v); else { fSt.delete('all'); fSt.add(v); } } }
    else if(dim==='lv'){ if(fLv.has(v)) fLv.delete(v); else fLv.add(v); }
    syncFilterUI(); pos=0; render();
  });
  document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim();pos=0;render();});
  document.getElementById('city').addEventListener('change',e=>{fCity=e.target.value.trim();pos=0;render();});
  populateCities();
  render();
}
async function unlock(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('gerr');
  const btn=document.querySelector('#gate button');
  if(!pw){err.textContent='请输入密码';return;}
  if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='解锁中…';}
  err.textContent='';
  try{
    const data=await decrypt(ENC, pw);
    DATA=data;
    document.getElementById('gate').style.display='none';
    initApp();
  }catch(e){
    err.textContent = (e && e.message==='OLD_BROWSER')
      ? '当前浏览器版本过低，请用 Safari 或 Chrome 打开'
      : '密码错误，请重试';
  }finally{
    if(btn){btn.disabled=false;btn.textContent=btn.dataset.t||'解锁进入';}
  }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});


function lvColor(l){return {S:'#E8A33D',A:'#1c3f7a',B:'#3f6fb0',C:'#1f9d57',D:'#9aa3b0'}[l]||'#1c3f7a';}
function list(){
  return DATA.filter(d=>{
    const s=prog[d.no]?prog[d.no].s:'待加';
    const okSt = fSt.size===0 || [...fSt].some(v=>ST_MAP[v]===s);
    const okLv = fLv.size===0 || fLv.has(d.lvl);
    let okQ=true;
    const dn=(prog[d.no]&&prog[d.no].name)||d.name;
    const dboss=(prog[d.no]&&prog[d.no].boss)||d.boss||'';
    if(query){ const q=query.toLowerCase(); okQ=(dn+'').toLowerCase().includes(q)||(dboss+'').toLowerCase().includes(q)||(d.city+'').toLowerCase().includes(q); }
    const okCity = !fCity || (d.city+'').toLowerCase()===(fCity+'').toLowerCase();
    return okSt && okLv && okCity && okQ;
  });
}
function cnt(){let sent=0,pass=0,old=0;for(const k in prog){const s=prog[k].s;if(s==='已发送')sent++;if(s==='已通过')pass++;if(s==='已加过')old++;}return {sent,pass,old};}
function render(){

  const d=arr[pos], box=document.getElementById('card');
  const {sent,pass,old}=cnt();

       <button class="b-prev" onclick="go(-1)">← 上一条</button>
       <button class="b-next" onclick="go(1)">下一条 →</button>
     </div>
   </div>`;
  document.getElementById('prog').innerHTML=`已通过 <b style="color:#fff">${pass}</b> / 已发送 ${sent} / 已加过 ${old} / 共 ${DATA.length} ｜ 本筛 ${pos+1}/${arr.length}`;
  document.getElementById('bar').style.width=Math.round(pass/DATA.length*100)+'%';
}
function copyScript(){const d=list()[pos];if(!d)return;navigator.clipboard?navigator.clipboard.writeText(d.script).then(()=>alert('话术已复制，去微信粘贴')):alert(d.script);}
function copyTel(){const d=list()[pos];if(!d)return;const t=(d.tel||'').trim();if(!t){alert('该客户无电话，可按公司名搜索添加');return;}if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>alert('号码已复制：'+t)).catch(()=>alert(t));}else{alert(t);}}
function populateCities(){
  const sel=document.getElementById('city'); if(!sel)return;
  const cs=[...new Set(DATA.map(d=>(d.city||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));
  const cur=sel.value;
  sel.innerHTML='<option value="">全部城市</option>'+cs.map(c=>'<option value="'+c.replace(/"/g,'&quot;')+'">'+c+'</option>').join('');
  if(cs.includes(cur)) sel.value=cur;
}
function mark(s){const d=list()[pos];if(!d)return;const P=prog[d.no]||{s:'待加'};
  if(s==='已发送'){P.s='已发送';if(!P.sent)P.sent=today();}
  else if(s==='已通过'){P.s='已通过';if(!P.sent)P.sent=today();P.pass=today();}
  else if(s==='已加过'){P.s='已加过';}
  prog[d.no]=P;save();pos=Math.min(pos+1,list().length-1);render();}
function go(n){pos+=n;if(pos<0)pos=0;render();}
function saveName(input){
  const d=list()[pos]; if(!d)return;
  const v=(input.value||'').trim();
  if(!v){ render(); return; }
  d.name=v;
  if(!prog[d.no]) prog[d.no]={s:'待加'};
  prog[d.no].name=v;
  save();
  render();
}
function saveBoss(input){
  const d=list()[pos]; if(!d)return;
  const v=(input.value||'').trim();
  if(!prog[d.no]) prog[d.no]={s:'待加'};
  if(!v){ delete prog[d.no].boss; save(); render(); return; }
  prog[d.no].boss=v;
  save();
  render();
}
function exportProgress(){
  const rows=[['序','客户名称','城市','等级','标签','电话','状态','发送日期','通过日期','微信搜索方式','备注名','联系人名称']];
  DATA.forEach(d=>{
    const P=prog[d.no]||{};
    const dn=(prog[d.no]&&prog[d.no].name)||d.name;
    const dboss=(prog[d.no]&&prog[d.no].boss)||d.boss||'';
    rows.push([d.no,dn,d.city,d.lvl,d.tag,d.tel||'',P.s||'待加',P.sent||'',P.pass||'',d.search,d.remark,dboss]);
  });
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+(c==null?'':String(c).replace(/"/g,'""'))+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='加粉进度_'+today()+'.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);document.body.removeChild(a);},100);
  alert('已导出 '+rows.length+' 条进度到 CSV 文件\n\n可在手机「文件」中打开，或发到电脑用 Excel 查看/回传给我做跟进（含"已加过"标记）。');
}
function parseCSV(t){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function importProgress(input){
  const f=input.files && input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const rows=parseCSV(String(r.result));
      const VAL={'待加':1,'已发送':1,'已通过':1,'已加过':1};
      let n=0;
      for(let i=1;i<rows.length;i++){
        const row=rows[i]; if(row.length<7) continue;
        const no=parseInt(row[0],10); if(!no) continue;
        const s=(row[6]||'').trim(); if(!VAL[s]) continue;
        prog[no]={s:s, sent:(row[7]||'').trim(), pass:(row[8]||'').trim()};
        if(row.length>11){ const b=(row[11]||'').trim(); if(b) prog[no].boss=b; }
        n++;
      }
      save(); render();
      alert('✅ 已导入 '+n+' 条进度\n\n进度已从 CSV 备份恢复，可继续跟进。');
    }catch(e){ alert('导入失败：'+e.message); }
    input.value='';
  };
  r.readAsText(f,'utf-8');
}
function syncFilterUI(){
  document.querySelectorAll('#filters button[data-dim]').forEach(b=>{
    const dim=b.dataset.dim, v=b.dataset.v;
    const on = dim==='st'
      ? (fSt.size===0 && v==='all') || (fSt.size>0 && fSt.has(v))
      : fLv.has(v);
    b.classList.toggle('on', !!on);
  });
}
